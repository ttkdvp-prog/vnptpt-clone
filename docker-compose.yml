# Local / VPS Postgres for An Hung Thinh ERP
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anhungthinh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-anhungthinh}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDIA_PROVIDER: ${NEXT_PUBLIC_MEDIA_PROVIDER:-uploads}
        NEXT_PUBLIC_DATA_SOURCE: api
        NEXT_PUBLIC_API_BASE_URL: ''
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anhungthinh}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-anhungthinh}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_DATA_SOURCE: api
      NEXT_PUBLIC_API_BASE_URL: ''
      NEXT_PUBLIC_MEDIA_PROVIDER: ${NEXT_PUBLIC_MEDIA_PROVIDER:-uploads}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      NODE_ENV: production
    volumes:
      - anhungthinh_uploads:/data/uploads

volumes:
  pgdata:
  anhungthinh_uploads:
